services:
  keycloak:
    container_name: keycloak.local.data.platform
    image: quay.io/keycloak/keycloak:22.0.1
    command: ["start-dev", "--import-realm"]
    ports:
      - "28080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # KC_HEALTH_ENABLED: "true"
    volumes:
      - ./default_realm/:/opt/keycloak/data/import:ro
      # - ./relm:/tmp
    healthcheck:
      test: ["CMD", "curl", "--head", "-fsS", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    networks:
      - backend

# 資料URL:https://www.keycloak.org/server/containers

networks:
  backend:
    external: true