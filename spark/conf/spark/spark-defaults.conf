# Icebergの設定
spark.sql.extensions    org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

## Iceberg専用カタログ(For Pord)
spark.sql.catalog.local_data_platform    org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.local_data_platform.type   hive
spark.sql.catalog.local_data_platform.uri    thrift://metastore-thrift.local.data.platform:9083

## Iceberg専用カタログ(For miscellaneous)
