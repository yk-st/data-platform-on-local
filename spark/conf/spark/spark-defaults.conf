spark.sql.catalog.dev_local_data_platform    org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.dev_local_data_platform.type   hadoop
spark.sql.catalog.dev_local_data_platform.warehouse s3a://dev-local-data-platform/warehouse/

