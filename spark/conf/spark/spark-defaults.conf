## デフォルトのカタログを設定する
spark.sql.defaultCatalog    local_data_platform

spark.sql.warehouse.dir s3a://local-data-platform/warehouse/
#hive.metastore.warehouse.dir s3a://local-data-platform/warehouse/

# Gold 用カタログ(For Pord)
# spark.sql.catalog.iceberg_gold_prod           org.apache.iceberg.spark.SparkCatalog
# spark.sql.catalog.iceberg_gold_prod.type      hive
# spark.sql.catalog.iceberg_gold_prod.uri       thrift://metastore-thrift.local.data.platform:9083
#spark.sql.catalog.iceberg_gold_prod.warehouse   s3a://data-platform-prod-gold/warehouse/

# ─ Iceberg 書込み最適化 ─
spark.iceberg.commit.manifest-merge.enabled true
spark.iceberg.commit.manifest.min-count-to-merge    5
spark.iceberg.write.target-file-size-bytes  268435456
# ストリーミングの場合は33554432など小さい数字にすることもけんとする
spark.sql.catalog.data_platform.write.manifest.target-size-bytes    134217728
spark.sql.iceberg.cache.enabled false
spark.sql.iceberg.cache.max.capacity    256m
spark.sql.iceberg.cache.expire-after-access 30m

# metastore関連の設定(Iceberg以外よう)
spark.sql.catalogImplementation hive
# 本来metastore ver4.0.0なのでsupported versionを考えると不整合な部分があるが、説明のためであれば不要なのでデフォルトの2.3.9を利用するものとする
#spark.sql.hive.metastore.version 2.3.9
#spark.sql.hive.metastore.jars file://root/spark/jars/*
#spark.sql.hive.metastore.jars.path file://root/spark/metastore_jars/*
spark.hadoop.hive.metastore.uris    thrift://metastore-thrift.local.data.platform:9083
spark.eventLog.enabled  true
spark.eventLog.compress true
spark.history.provider     org.apache.hadoop.fs.s3a.S3AFileSystem
## TODO 先にディレクトリを作っておかなければならない(history.dir)
spark.history.fs.logDirectory     s3a://process-bucket/spark-history/
## TODO 先にディレクトリを作っておかなければならない(eventLog.dir)
spark.eventLog.dir  s3a://process-bucket/spark-history/
spark.hadoop.fs.s3a.fast.upload true
spark.hadoop.fs.s3a.impl    org.apache.hadoop.fs.s3a.S3AFileSystem

# 起動のモード(Standalone/yarn/k8sがある)
## Stand alone Modeの場合
spark.master    spark://spark-master1.local.data.platform:7077
spark.ui.enabled    false

#spark.hadoop.fs.s3a.connection.ssl.enabled=true
#spark.hadoop.fs.s3a.connection.ssl.trustAllCertificates=true

spark.hadoop.fs.s3a.endpoint    http://minio.local.data.platform:9000
spark.hadoop.fs.s3a.connection.ssl.enabled false
spark.hadoop.fs.s3a.access.key  5nCJP6jHFJd7PDsLlT3a
spark.hadoop.fs.s3a.secret.key  FXn6MFKDbNamyMzxiMBGIpgTDFu2r1IfymESfRJd
spark.hadoop.fs.s3a.path.style.access   true
# 環境変数からではなく、sparkの設定値(spark.hadoop.fs.s3a.access.key)から取得するようにする
spark.hadoop.fs.s3a.aws.credentials.provider    org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
spark.hadoop.fs.s3a.connection.ssl.enabled  false

# 一時ファイル置き場
#spark.local.dir  /tmp/spark

# standaloneモードなので、一つのソースの使い過ぎを防止
spark.executor.memory   1g
spark.executor.cores    1
spark.driver.memory 500m
spark.dynamicAllocation.enabled true
spark.dynamicAllocation.minExecutors 1
spark.dynamicAllocation.maxExecutors 3

spark.driver.memory 512m
spark.driver.cores 1
spark.executor.instances 2
spark.sql.shuffle.partitions 8
spark.default.parallelism 4

spark.files.fetchTimeout 60
spark.network.timeoutInterval 60
spark.dynamicAllocation.executorIdleTimeout 60

# 認証(OFF、ONにするとmysecretを渡さないと接続できない)
# ON時の接続例
# pyspark --master spark: // spark-master1.local.data.platform: 7077 \
#         --deploy-mode client \
#         --conf spark.authenticate.secret=mysecret \
#         --executor-memory 1G --total-executor-cores 1
spark.authenticate  false
spark.authenticate.secret   mysecret
spark.network.crypto.enabled false

# Streamingは依存が面倒なのでpackage指定で取得するようにする
# spark.jars.repositories https://repo1.maven.org/maven2,https://packages.confluent.io/maven/
# spark.jars.packages org.apache.avro:avro:1.12.0
# spark.driver.userClassPathFirst true
# spark.driver.userClassPathFirst    true

# 認可はIAM(MINIOの権限)で実現

# 互換性
## SQL ANSI(pandas APIを利用する場合はfalseに個別のセッションで設定すると良い)
spark.sql.ansi.enabled  true
## タイムゾーン
spark.sql.legacy.timeParserPolicy   LEGACY

# 最適化
spark.sql.adaptive.enabled  true
## Spark 3.0から導入された機能で、オプティマイザがコンパイル時パーティション（バケット含む）されたテーブルとフィルターがないかをチェックし、プルーニングを行うことでクエリと関係ないパーティションのスキャンをスキップすることでパフォーマンス改善する機能です。
spark.sql.optimizer.dynamicPartitionPruning true

# openlineage
spark.openlineage.transport.timeoutInMillis 3000
spark.openlineage.transport.maxRetries  1
spark.openlineage.transport.url  http://host.docker.internal:8661
spark.openlineage.transport.endpoint  api/v1/lineage
spark.openlineage.namespace  spark_jobs
#spark.extraListeners  io.openlineage.spark.agent.OpenLineageSparkListener
spark.openlineage.transport.type  http
# デフォルトはOpenLineageに接続しない
spark.extraListeners
#spark.openlineage.transport.type    console
spark.openlineage.columnLineage.datasetLineageEnabled   True