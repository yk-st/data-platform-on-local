coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
http-server.https.enabled=false
#discovery-server.enabled=true

# 必須: 環境名
node.environment=production

# 必須: ノードIDとデータディレクトリ( This must be unique for every node in the cluster )
node.id=ffffffff-ffff-ffff-ffff-ffffffffffff
#node.data-dir=/data/trino

# 必須: Discovery URI
discovery.uri=http://localhost:8080

# (Trinoにおいてサーバーを直接SSL化する方法より推奨の方法である、)リバプロでSSLをターミネートする
http-server.process-forwarded=true

# 認証を(Password。今回はLDAPに設定)
## 設定ファイルはpassword-authenticator.properties
## 余談だが、keycloakもあるのでOauth認証への変更も可
http-server.authentication.type=PASSWORD

# セキュア設定 for internal
internal-communication.shared-

# 認可(access-control)はaccess-control.propertiesにて設定する