
x-airflow-env: &airflow-common-env
  # ここを prod_bundle のパスに合わせる(デフォルトdags_folder = /opt/airflow/dags)
  #AIRFLOW__CORE__DAGS_FOLDER: "/opt/airflow/bundles/prod/dags"
  AIRFLOW__CORE__EXECUTOR: CeleryExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
  AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
  AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
  AIRFLOW__WEBSERVER__SHOW_TRIGGER_FORM_IF_NO_PARAMS: True
  AIRFLOW__API__SECRET_KEY: my_secret_key
  AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8094/execution/'
  AIRFLOW__CORE__INTERNAL_API_URL: "http://airflow-apiserver:8094/internal_api/"
  AIRFLOW__CORE__INTERNAL_API_SECRET_KEY: "secret"
  AIRFLOW__API_AUTH__JWT_SECRET: 'secret'
  AIRFLOW__CORE__DATABASE_ACCESS_ISOLATION: "True"
  OPENLINEAGE_URL: http://host.docker.internal:8661
  AIRFLOW__OPENLINEAGE__NAMESPACE: airflow_pipeline
  # SCRIPT_HOME: "/opt/airflow/bundles/prod"

  # 既存の dag_bundle_config_list はそのまま残して OK
  AIRFLOW__DAG_PROCESSOR__DAG_BUNDLE_CONFIG_LIST: >-
    [
      {
        "name": "prod_bundle",
        "classpath": "airflow.dag_processing.bundles.local.LocalDagBundle",
        "kwargs": { "path": "/opt/airflow/bundles/prod/dags" }
      },
      {
        "name": "dev_bundle",
        "classpath": "airflow.dag_processing.bundles.local.LocalDagBundle",
        "kwargs": { "path": "/opt/airflow/bundles/dev/dags" }
      }
    ]


x-airflow-mounts: &airflow-mounts
  - ./bundles/prod/dags:/opt/airflow/bundles/prod/dags
  - ./bundles/prod/scripts:/opt/airflow/bundles/prod/scripts
  - ./bundles/dev/dags:/opt/airflow/bundles/dev/dags
  - ./bundles/dev/scripts:/opt/airflow/bundles/dev/scripts
  - ../spark/conf/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
  - ./sql:/opt/airflow/sql:ro


services:
  postgres:
    image: postgres:15
    container_name: airflow_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    # volumes:
    #   - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  airflow-apiserver:
    build: .
    container_name: airflow-apiserver.local.data.platform
    hostname: airflow_apiserver.local.data.platform
    ports:
      - "8094:8094"
    environment:
      <<: *airflow-common-env
    command: >
      bash -c "
        exec airflow api-server --port 8094
      "
    volumes:
      *airflow-mounts
    networks:
      - backend
    depends_on:
      - airflow-init

  airflow-dag_processor:
    build: .
    container_name: airflow-dag_processor.local.data.platform
    hostname: airflow_dag_processor.local.data.platform
    environment:
      <<: *airflow-common-env
    command: ["dag-processor"]
    volumes:
      *airflow-mounts
    networks:
      - backend
    depends_on:
      - airflow-init

  airflow-triggerer:
    build: .
    environment:
      <<: *airflow-common-env
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - backend

  airflow-scheduler:
    build: .
    container_name: airflow_scheduler
    environment:
      <<: *airflow-common-env
    command: ["scheduler"]
    volumes:
      *airflow-mounts
    networks:
      - backend
    depends_on:
      - airflow-init

  airflow-worker:
    build: .
    # container_name: airflow_worker1.local.data.platform
    # hostname: airflow_worker1.local.data.platform
    environment:
      <<: *airflow-common-env
    command: >
      bash -c "
        cd /opt/airflow/bundles/prod/scripts &&
        zip -r /opt/airflow/prod_scripts.zip * &&
        exec airflow celery worker
      "
    volumes:
      *airflow-mounts
    networks:
      - backend
    depends_on:
      - airflow-init

  redis:
    image: redis:7.2
    container_name: airflow_redis
    networks:
      - backend

  airflow-init:
    image: apache/airflow:3.0.3-python3.12
    container_name: airflow_init
    command: >
      bash -c "
        airflow connections delete spark_con || true &&
        airflow connections add spark_con --conn-uri 'spark://spark-master1.local.data.platform:7077'
      "
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
      AIRFLOW__API__SECRET_KEY: my_secret_key
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: true
      _AIRFLOW_WWW_USER_PASSWORD: admin
      _PIP_ADDITIONAL_REQUIREMENTS: ''
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    networks:
      - backend
    depends_on:
      - postgres
      - redis

networks:
  backend:
    external: true
