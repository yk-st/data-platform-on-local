# KAFKA_REST_LISTENERS: http://0.0.0.0:8082
# KAFKA_REST_BOOTSTRAP_SERVERS: SASL_PLAINTEXT://kafka_broker1:9092,SASL_PLAINTEXT://kafka_broker2:9092
# KAFKA_REST_CLIENT_SASL_MECHANISM: PLAIN
# KAFKA_INTER_BROKER_LISTENER_NAME: SASL_PLAINTEXT
# KAFKA_REST_CLIENT_SASL_JAAS_CONFIG: org.apache.kafka.common.security.plain.PlainLoginModule required username="kafka" password="password";
