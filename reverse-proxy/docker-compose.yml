services:

  nginx:
    image: nginx:1.27.5
    container_name: reverse-proxy.local.data.platform
    hostname: reverse-proxy.local.data.platform
    ports:
      - "443:443"
    volumes:
      - ./conf/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../ca_certs/server_certs/server.crt:/etc/nginx/certs/server.crt:ro
      - ../ca_certs/server_certs/server.key:/etc/nginx/certs/server.key:ro
      - ./conf/.htpasswd_history:/etc/nginx/.htpasswd_history:ro
    networks:
      - backend

networks:
  backend:
    external: true
